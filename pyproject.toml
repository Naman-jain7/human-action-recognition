[project]
name = "human_action_recognition"
version = "1.0.0"
description = "DL Project"
readme = "README.md"
requires-python = "==3.11.9"

dependencies = [
    "torch==2.8.0",
    "torchvision==0.23.0",
    "torchaudio==2.8.0",

    "numpy",
    "opencv-python",
    "mediapipe==0.10.9",
    "tqdm",
    "scikit-learn",
    "matplotlib",
    "seaborn",
    "python-dotenv",
    "huggingface_hub",
]

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu129" }
torchvision = { index = "pytorch-cu129" }
torchaudio = { index = "pytorch-cu129" }

[tool.uv]
package = false

[project.optional-dependencies]
dev = [
    "ipykernel",
]